<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Donate to Gift of the Givers PayFast PayPal secure"><title>Donate | Gift of the Givers</title><link rel="stylesheet" href="style.css"></head><body>
<header><nav><div class="logo">Gift of the Givers<span>FOUNDATION</span></div><div class="hamburger">☰</div><ul class="nav-links">
<li><a href="index.html">Home</a></li><li><a href="about.html">About</a></li><li><a href="projects.html">Projects</a></li><li><a class="donate-btn active" href="donate.html">Donate & Get Involved</a></li><li><a href="contact.html">Contact</a></li></ul></nav></header>
<div class="container"><h1>Donate & Get Involved</h1><div class="grid" style="grid-template-columns:1fr 1fr;">
<div><h2>Make a Donation</h2><form id="donateForm"><div style="display:flex;gap:1rem;margin-bottom:1rem;"><label><input type="radio" name="freq" checked> ONCE-OFF</label><label><input type="radio" name="freq"> MONTHLY</label></div>
<label>Select Amount (ZAR)</label><div class="amount-options"><button data-amount="100">R100</button><button data-amount="250" class="selected">R250</button><button data-amount="500">R500</button><button data-amount="custom">Custom</button></div>
<input type="hidden" id="selectedAmount" value="250"><input type="number" id="customAmount" placeholder="Custom: R___" oninput="document.getElementById('selectedAmount').value=this.value">
<label>Payment Method</label><div style="border:1px solid #ccc;padding:0.8rem;margin:0.5rem 0;"><label><input type="radio" name="payment" value="PayFast"> PayFast - Secure</label></div><div style="border:1px solid #ccc;padding:0.8rem;margin:0.5rem 0;"><label><input type="radio" name="payment" value="PayPal"> PayPal - International</label></div>
<button type="submit" class="btn" style="width:100%;margin-top:1rem;">DONATE NOW - Secure Payment</button></form></div>
<div><h2>Join as a Volunteer</h2><form id="volunteerForm"><input type="text" id="vName" placeholder="Full Name" required><input type="email" placeholder="Email" required><select><option>Select Skill</option><option>Medical - Doctor/Nurse</option><option>Driver</option><option>Logistics</option><option>Admin</option></select><div style="margin:1rem 0;"><label><input type="checkbox"> Weekdays</label> <label><input type="checkbox"> Weekends</label></div><textarea placeholder="How would you like to help?" rows="4"></textarea><button type="submit" class="btn" style="background:black;">SUBMIT APPLICATION</button></form></div>
</div></div><footer><p>&copy; 2025 Gift of the Givers</p></footer><script src="script.js"></script></body></html>
